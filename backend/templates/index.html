<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMETHEUS-X | PCB Inspection</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #172438;
            border-bottom: 2px solid #00d4ff;
        }

        h1 {
            color: #00d4ff;
            letter-spacing: 2px;
        }

        .container {
            margin: 40px auto;
            max-width: 800px;
            padding: 25px;
            background: #1b2a40;
            border-radius: 12px;
        }

        .upload-box {
            border: 2px dashed #00d4ff;
            padding: 35px;
            border-radius: 10px;
            margin: 25px 0;
        }

        input, button {
            margin: 12px;
            padding: 12px;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #00bcd4;
            color: #101827;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00e5ff;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            margin-top: 20px;
            display: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>PROMETHEUS-X</h1>
        <p>AI-Powered PCB Inspection Platform</p>
    </header>

    <div class="container">

        <h2>PCB Inspection Dashboard</h2>
        <p>Upload a PCB image to begin inspection.</p>

        <div class="upload-box">

            <h3>Select PCB Image</h3>

            <input type="file" id="pcbImage" accept="image/*">

            <br>

            <img id="preview" alt="PCB Preview">

            <br>

            <button onclick="inspectPCB()">
                Start Inspection
            </button>

        </div>

        <div id="result">
            Waiting for PCB image...
        </div>

    </div>

    <script>
        const input = document.getElementById("pcbImage");
        const preview = document.getElementById("preview");

        input.addEventListener("change", function() {
            const file = input.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
                document.getElementById("result").innerText =
                    "Image selected. Ready for inspection.";
            }
        });

        function inspectPCB() {
            if (!input.files[0]) {
                alert("Please select a PCB image first.");
                return;
            }

            alert("Frontend is ready. AI connection comes next!");
        }
    </script>

</body>
</html>
